<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1e3a8a">
    <title>Offline — Kasir Impeesa</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #0f172a; background: linear-gradient(180deg, #e3e9f8 0%, #e9eef9 320px, #eef2fb 100%); }
        main { width: min(420px, 100%); padding: 32px 28px; border-radius: 24px; background: #fff; box-shadow: 0 20px 50px -30px rgba(30, 58, 138, .45); text-align: center; }
        img { width: 72px; height: 72px; margin: 0 auto 18px; display: block; }
        h1 { margin: 0 0 8px; font-size: 22px; }
        p { margin: 0 0 22px; color: #64748b; line-height: 1.6; }
        button { padding: 12px 26px; border: 0; border-radius: 999px; background: #1e3a8a; color: #fff; font: inherit; font-weight: 600; min-height: 44px; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" alt="">
        <h1>Tidak ada koneksi</h1>
        <p>Kasir Impeesa butuh internet untuk memuat stok dan harga terbaru. Periksa Wi-Fi atau data seluler, lalu coba lagi.</p>
        <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
</body>
</html>
